[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-loop-controller"
version = "5.8.0"
description = "X-Star Autonomous Brain & HADL v5.8 Dual-Loop Cognitive Controller: Non-Token Continuous Latent Thought Matrix, Toroidal Central Routing, IPv6 Hexadecadic Memory, and Commutative Dual-Composition Architecture"
readme = "README_PYPI.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Ch3nOff" }
]
keywords = [
    "deep-learning",
    "transformers",
    "latent-reasoning",
    "multimodal",
    "vision-language",
    "fast-weights",
    "cognitive-architecture",
    "system-2-thinking",
    "pytorch"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=1.24.0,<3.0.0",
]

[project.optional-dependencies]
torch = [
    "torch>=2.0.0,<3.0.0",
]
dev = [
    "build",
    "twine",
]
llm = [
    "transformers>=4.40.0,<5.0.0",
    "accelerate>=0.28.0,<2.0.0",
]
vllm = [
    "vllm>=0.6.0",
    "torch>=2.0.0,<3.0.0",
    "transformers>=4.40.0,<5.0.0",
]
serve = [
    "torch>=2.0.0,<3.0.0",
    "transformers>=4.40.0,<5.0.0",
    "accelerate>=0.28.0,<2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
]
all = [
    "torch>=2.0.0,<3.0.0",
    "transformers>=4.40.0,<5.0.0",
    "accelerate>=0.28.0,<2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "build",
    "twine",
]

[project.scripts]
xstar = "xstar.cli:main"
xstar-infer = "xstar.inference.cli_app:main"
dual-loop = "dual_loop.cli:main"
hadl = "dual_loop.cli:main"

[project.entry-points."vllm.general_plugins"]
hadl_dual_loop = "dual_loop.vllm_plugin:register"

[project.urls]
Homepage = "https://github.com/Ch3nOff/dual-loop-controller"
Repository = "https://github.com/Ch3nOff/dual-loop-controller.git"
"Bug Tracker" = "https://github.com/Ch3nOff/dual-loop-controller/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["xstar*", "dual_loop*"]
exclude = ["tests*", "dist*", "build*"]

[tool.setuptools.package-data]
dual_loop = ["checkpoints/checkpoint_trained_dualloop.pt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
